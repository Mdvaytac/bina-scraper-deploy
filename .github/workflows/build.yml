name: Build and Push to ACR

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # bu, "Actions" tabında əl ilə "Run workflow" düyməsi ilə də işə salmağa imkan verir

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/bina-scraper:${{ github.sha }}
